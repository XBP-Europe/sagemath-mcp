version: 2
updates:
  # `uv`, not `pip`. The pip ecosystem scans `requirements*.txt`, and the only
  # one here -- `requirements-passagemath.txt` -- is a *generated export* of
  # `uv.lock` that `Dockerfile.passagemath` installs with `--require-hashes`.
  # Dependabot edited that file without touching the lock it derives from, so
  # every grouped update contradicted the lock and failed
  # `test_the_export_matches_the_lockfile`: PRs #141, #144 and #150, all red
  # for the same structural reason. A dependency PR that is always red is
  # worse than none, because it trains a reviewer to wave the next one
  # through -- and #141 was lifting the fastmcp cap.
  #
  # The uv ecosystem updates `pyproject.toml` and `uv.lock`, which is where a
  # version actually lives here. The export is then regenerated with
  # `make passagemath-lock`; CONTRIBUTING.md says so, and the drift test names
  # the command in its failure message.
  - package-ecosystem: "uv"
    directory: "/"
    # Do not touch the generated export. Dependabot writes it without the
    # project's flags -- measured on PR #152, 2,975 requirement lines against
    # the 2,802 a real export produces -- so what it writes is wrong rather
    # than merely stale, and the drift test refuses it either way. Excluded,
    # the file is simply left alone and regenerated deliberately by
    # `make passagemath-lock`.
    #
    # `exclude-paths` shipped in August 2025 and is the documented way to do
    # this. It may not take effect here: dependabot-core#15102, open since
    # 2026-05-21, reports the uv ecosystem ignoring it. Setting it costs
    # nothing and states the intent where the next person will look; the
    # `Regenerate the passagemath export` workflow is what actually holds,
    # whether this is honoured or not.
    exclude-paths:
      - "requirements-passagemath.txt"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5
    ignore:
      # A fastmcp major changes what `Context.session_id` means: 3 -> 4 made it
      # a fresh id per call on the 2026-07-28 protocol era, which silently cost
      # every client its variables until this server stopped relying on it
      # (docs/fastmcp4_session_regression.md). So the next major is adopted by
      # hand, after `tests/test_cache_isolation.py` passes on it on both eras,
      # never by a weekly PR that is one click from merged -- #141 proposed
      # exactly that for 4.x before the server was ready. Patch and minor
      # updates within 4.x still arrive.
      - dependency-name: "fastmcp"
        update-types: ["version-update:semver-major"]
      # And the package `fastmcp` is a thin wrapper over. They are released
      # together at the same version -- `fastmcp==4.0.8` requires
      # `fastmcp-slim[client,server]==4.0.8` -- so capping only the name above
      # left the sibling free. Dependabot proposed exactly that in PR #144:
      # `fastmcp-slim` 3.4.7 to 4.0.5 in the hash-locked requirements the
      # passagemath image installs, while `fastmcp` stayed at 3.4.7. That pair
      # is incoherent as well as regressed, and it reaches the image rather
      # than the test environment. Same removal criterion as above.
      - dependency-name: "fastmcp-slim"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
