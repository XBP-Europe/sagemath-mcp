name: Scheduled audit

# pip-audit is blocking in CI, which is deliberate: a known-vulnerable
# dependency should stop a merge. The side effect is that a new upstream
# advisory turns someone's unrelated pull request red, with no change of theirs
# to blame. This runs the same audit against main on a schedule so an advisory
# is found on its own timetable, and opens an issue rather than ambushing a
# contributor.

on:
  schedule:
    # Mondays, 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -e .[dev]
      - name: Audit dependencies
        id: audit
        # Do not fail the job here: the report is wanted either way, and the
        # issue below is more useful than a red schedule nobody is watching.
        continue-on-error: true
        run: |
          set -o pipefail
          uv run pip-audit --skip-editable --desc | tee audit-report.txt
      - name: Open an issue when something is found
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Dependency advisory found by the scheduled audit"
          # One open issue at a time; append rather than pile up duplicates.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
            --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n\n```\n%s\n```\n' \
            "The weekly audit found advisories against \`main\`. CI blocks on pip-audit, so this will also fail any open pull request until the lock is updated (\`uv lock --upgrade\`)." \
            "$(head -60 audit-report.txt)")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-report
          path: audit-report.txt
          if-no-files-found: ignore

  allowlist:
    # The caller allowlist is baked into the source for speed, so it is only as
    # good as the last time anyone compared it with the installed SageMath. A
    # push-triggered check misses drift that arrives without a commit -- an
    # upstream image rebuilt under the same tag -- which is exactly what a
    # weekly run is for.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -e .[dev]
      - name: Start Sage container
        run: |
          IMAGE="$(sed -n 's/^FROM //p' Dockerfile | head -1)"
          SAGEMATH_MCP_DOCKER_IMAGE="$IMAGE" make sage-container
      # Sage bundles pytest but not pytest-asyncio, so without this the run dies
      # in conftest with ModuleNotFoundError -- which is what happened the first
      # time this job was ever executed, months after it was written. `make
      # integration-test` depends on this target; calling pytest directly does
      # not, and this job calls it directly to run one test.
      - name: Install the dev extras into Sage's own Python
        run: make sage-deps
      - name: Allowlist matches the installed SageMath
        id: drift
        run: |
          set -o pipefail
          docker exec sage-mcp bash -lc \
            "cd /workspace && sage -python -m pytest \
             tests/test_integration.py -k allowlist_matches -q" | tee allowlist.log
      - name: Open an issue when it has drifted
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Caller allowlist has drifted from the installed SageMath"
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          BODY=$(printf '%s\n\n%s\n\n%s\n' \
            "The baked caller allowlist no longer matches what this SageMath offers. Names it does not cover are unreachable for callers; names it lists that no longer exist mean it has gone stale." \
            "Review each addition before regenerating -- a helper that compiles, spawns or writes belongs in _DANGEROUS_SAGE_MODULES instead. See scripts/generate_allowlist.py." \
            "Run: $RUN_URL")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allowlist-drift-log
          path: allowlist.log
          if-no-files-found: ignore
