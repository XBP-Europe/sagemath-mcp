name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -e .[dev]
      - name: Lint
        run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -e .[dev]
      - name: Unit Tests with coverage
        # --cov-fail-under backs the README's coverage badge: the claim fails
        # the build rather than quietly becoming untrue.
        run: >-
          uv run pytest --cov=sagemath_mcp --cov-report=term-missing
          --cov-report=xml --cov-branch --cov-fail-under=100
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -e .[dev]
      - name: Audit dependencies
        run: uv run pip-audit --skip-editable --desc
      # The lockfile is what `uv sync` installs, so a stale one means the audit
      # above and the dependencies a consumer actually gets are different sets.
      # It went stale at the v0.5.0 release and nothing noticed.
      - name: Lockfile is current
        run: uv lock --check

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        run: |
          curl -sSL https://get.helm.sh/helm-v3.15.2-linux-amd64.tar.gz | tar -xz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Helm lint
        run: helm lint charts/sagemath-mcp
      - name: Helm template
        run: helm template test charts/sagemath-mcp

  integration:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -e .[dev]
      # A `services:` container cannot see the workspace, so the suite had
      # nothing to run against. Start the container the same way local
      # development does, with the repo mounted at /workspace. The image is
      # read from the Dockerfile so the Sage version has a single source of
      # truth.
      - name: Start Sage container
        run: |
          IMAGE="$(sed -n 's/^FROM //p' Dockerfile | head -1)"
          echo "Using Sage image: $IMAGE"
          SAGEMATH_MCP_DOCKER_IMAGE="$IMAGE" make sage-container
      - name: Integration Tests
        run: make integration-test
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-artifacts
          path: |
            integration.log
            integration-artifacts.tar.gz
            doctest-corpus-stats.md
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -e .[dev]
      - name: Docker Compose smoke test
        run: |
          docker compose up --build -d
          export SAGEMATH_MCP_URL="http://127.0.0.1:8314/mcp"
          uv run python scripts/exercise_mcp.py
      - name: Verify monitoring metrics
        run: |
          export SAGEMATH_MCP_URL="http://127.0.0.1:8314/mcp"
          uv run python - <<'PY'
          import asyncio
          import json
          import os
          from fastmcp import Client


          async def fetch_metrics(url: str, attempts: int = 10, delay: float = 3.0):
              last_error = None
              for attempt in range(1, attempts + 1):
                  try:
                      print(f"[metrics] Attempt {attempt}/{attempts} connecting to {url}", flush=True)
                      async with Client(transport=url) as client:
                          metrics = await client.read_resource("resource://sagemath/monitoring/metrics")
                          assert metrics, "No metrics returned"
                          payload = json.loads(metrics[0].text)
                          attempts = payload.get("attempts")
                          successes = payload.get("successes")
                          print(
                              f"[metrics] Snapshot reachable: attempts={attempts}, successes={successes}",
                              flush=True,
                          )
                          return
                  except Exception as exc:
                      last_error = exc
                      print(f"[metrics] Attempt {attempt} failed: {exc!r}", flush=True)
                      await asyncio.sleep(delay)
              raise RuntimeError("Unable to verify monitoring metrics") from last_error


          asyncio.run(fetch_metrics(os.environ["SAGEMATH_MCP_URL"]))
          PY
          docker compose down
      - name: Build artifacts
        run: make build

  passagemath:
    # The pip-installable alternative runtime (docs/passagemath_evaluation.md):
    # `pip install .[passagemath]` gives a working `from sage.all import *` with
    # no Docker. This lane cold-installs the EXACT pin and runs the whole suite
    # against it -- the real worker, the passagemath artifact-drift tests and the
    # doctest corpus sweep -- so it doubles as the smoke gate for bumping the pin:
    # a release like 10.8.10, which broke the Maxima backend, fails here instead
    # of in a user's install. Cold setup is ~1 min against a 3 GB image pull, so
    # this is the fast Sage lane. Pinned to Python 3.12: passagemath ships cp312
    # wheels for every backend this server's tools need.
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Create virtual environment
        run: uv venv --python 3.12
      - name: Cold-install the pinned passagemath runtime
        run: uv pip install -e '.[dev,passagemath]'
      - name: Fail fast unless passagemath is the live runtime
        # Every real-runtime test keys on `shutil.which("sage")`; passagemath
        # ships that wrapper (accepting `-python`) via passagemath-environment.
        # Without it the suite would skip every Sage test and pass vacuously, so
        # assert the wrapper is present AND that the passagemath artifact set is
        # the one `_artifacts` selected.
        run: |
          source .venv/bin/activate
          command -v sage
          sage --version
          python - <<'PY'
          import importlib.metadata

          import sagemath_mcp._artifacts as artifacts

          # `import sage` alone does not resolve the lazy `sage.version` under
          # passagemath's namespace-package layout, so read the distribution
          # metadata -- the same probe `_artifacts` uses to select the set.
          assert artifacts.IS_PASSAGEMATH, "passagemath artifact set was not selected"
          print("passagemath-standard", importlib.metadata.version("passagemath-standard"))
          PY
      - name: Test suite against passagemath (real worker + corpus sweep)
        # Never export SAGEMATH_MCP_PURE_PYTHON here: an inherited "=1" makes the
        # real worker silently preload `from math import *`, and the suite would
        # pass against the shim rather than against passagemath.
        env:
          SAGEMATH_MCP_DOCTEST_STATS_FILE: doctest-corpus-stats.md
        run: |
          source .venv/bin/activate
          unset SAGEMATH_MCP_PURE_PYTHON
          pytest -ra
      - name: Upload passagemath corpus stats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: passagemath-corpus-stats
          path: doctest-corpus-stats.md
          if-no-files-found: ignore
