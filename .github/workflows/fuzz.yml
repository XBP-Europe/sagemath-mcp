# Continuous fuzzing of the AST security policy.
#
# `validate_code` is the first lock on model-written code and the one that has
# been picked most often -- REVIEW_ACTIONS items 37, 46, 49, 50, 52, 56, 61-63,
# 79 and 90 are all the same shape, a spelling nobody enumerated. Enumerated
# cases and property tests are both bounded by what a person thought to write;
# this is not.
#
# **Why not ClusterFuzzLite.** It was wired up first and removed the same day.
# `gcr.io/oss-fuzz-base/base-builder-python` ships Python 3.11, this package
# requires >=3.12, and `compile_python_fuzzer` is bound to the image's own
# interpreter, so the build failed outright. Lowering the floor to suit the
# tooling would be the tail wagging the dog, and running the fuzzer on 3.11
# anyway would be worse than not running it: PEP 701 rewrote f-string parsing
# in 3.12, so the policy would face a different parser for exactly the
# construct that produced this campaign's one false positive. A coverage-guided
# fuzzer on the wrong interpreter tests a configuration nobody ships.
#
# So the campaign runs on the Python the server requires, and trades coverage
# guidance for being about the real thing. This leaves Scorecard's Fuzzing
# check at 0, which is the correct answer to the question it asks.
name: Fuzz

on:
  pull_request:
    paths:
      - "src/sagemath_mcp/security.py"
      - "src/sagemath_mcp/codegen.py"
      - "src/sagemath_mcp/_sage_worker.py"
      - "src/sagemath_mcp/allowlist*.py"
      - "src/sagemath_mcp/star_exports*.py"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Weekly, with a budget no pull request could afford.
    - cron: "37 4 * * 1"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Programs to generate"
        default: "2000000"

permissions: {}

jobs:
  campaign:
    name: Generative campaign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ITERATIONS: >-
        ${{ inputs.iterations
          || (github.event_name == 'schedule' && '2000000' || '50000') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # The version the package requires. Fuzzing an AST policy on any
          # other one measures a parser we do not ship.
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Fuzz the AST policy
        # A pull request gets seconds; the weekly run gets half an hour. Each
        # harness fails if it judges too little, so a generator that stops
        # producing usable input cannot report clean.
        run: |
          uv run python fuzz/fuzz_validate.py --iterations "${ITERATIONS}"
      - name: Fuzz the codegen gates
        # The higher-consequence surface: generated templates run under
        # trusted_policy(), which permits sage_eval.
        run: |
          uv run python fuzz/fuzz_codegen.py --iterations "${ITERATIONS}"
      - name: Fuzz the worker protocol
        run: |
          uv run python fuzz/fuzz_protocol.py --iterations "${ITERATIONS}"
