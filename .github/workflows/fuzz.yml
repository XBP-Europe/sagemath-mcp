# Continuous fuzzing of the AST security policy.
#
# `validate_code` is the first lock on model-written code and the one that has
# been picked most often -- REVIEW_ACTIONS items 37, 46, 49, 50, 52, 56, 61-63,
# 79 and 90 are all the same shape, a spelling nobody enumerated. Enumerated
# cases and property tests are both bounded by what a person thought to write;
# this is not.
name: Fuzz

on:
  pull_request:
    paths:
      - "src/sagemath_mcp/security.py"
      - "src/sagemath_mcp/allowlist*.py"
      - "src/sagemath_mcp/star_exports*.py"
      - "fuzz/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    # Weekly, with a longer budget than a PR can afford.
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  campaign:
    # The deterministic campaign, which needs no fuzzing engine and so runs on
    # every relevant PR in seconds. It fails if it judges fewer programs than
    # it has templates: "clean" over nothing looks identical to "clean" over
    # everything, and an earlier version of this harness printed the former.
    name: Deterministic campaign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --extra dev
      - name: Fuzz the AST policy
        run: uv run python fuzz/fuzz_validate.py

  clusterfuzzlite:
    # The real thing: coverage-guided, with a corpus that persists between
    # runs. Pull requests get a short budget; the weekly run gets a long one.
    name: ClusterFuzzLite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: python
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: address
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event_name == 'schedule' && 1800 || 300 }}
          mode: ${{ github.event_name == 'schedule' && 'batch' || 'code-change' }}
          sanitizer: address
          output-sarif: true
