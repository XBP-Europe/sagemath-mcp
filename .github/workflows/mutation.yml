name: Mutation testing

# The mutation score of the security policy measures test *quality*, not
# correctness, and a full run is slow -- so this is never a required check on a
# PR. It runs weekly and on demand, regenerates mutation-stats.md, and uploads
# it as an artifact. No Sage is needed: the security suite it drives is
# pure-Python.
on:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: .tool-versions
          python-version: "3.12"
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install project
        run: uv pip install -e .[dev]
      - name: Run mutation testing on the security policy
        run: make mutation
      - name: Show the score
        run: cat mutation-stats.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-stats
          path: mutation-stats.md
