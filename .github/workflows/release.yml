name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install project
        run: uv pip install -e .[dev]
      - name: Lint
        run: make lint
      - name: Tests
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install build tool
        run: uv pip install build
      - name: Build artifacts
        run: uv run python -m build --sdist --wheel --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
      - name: Sign container image
        env:
          COSIGN_YES: "true"
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          DIGEST="${{ steps.build.outputs.digest }}"
          cosign sign "${IMAGE}@${DIGEST}"

  helm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Lint Helm chart
        run: helm lint charts/sagemath-mcp
      - name: Template Helm chart
        run: helm template sagemath charts/sagemath-mcp --debug

  publish:
    needs: [build, docker, helm]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sagemath-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Runs last so a failed publish cannot leave a release announcing a version
  # that was never shipped. Until this existed, every release object was created
  # by hand, and v0.4.0 shipped to PyPI while the releases page still advertised
  # v0.3.1 as Latest -- which is also where pyproject points its Changelog URL.
  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Extract release notes from the changelog
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Print the body of the "## [VERSION]" section, stopping at the next one.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            # Link-reference definitions live at the foot of the file; for the
            # newest entry there is no following section to stop at.
            flag && /^\[[0-9]+\.[0-9]+\.[0-9]+\]:/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            # Missing entry is worth surfacing, but not worth failing a release
            # that has already been published to PyPI.
            echo "::warning::No CHANGELOG.md entry for ${VERSION}; using generated notes."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; nothing to do."
            exit 0
          fi
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --verify-tag \
              --notes-file release-notes.md \
              dist/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              dist/*
          fi
