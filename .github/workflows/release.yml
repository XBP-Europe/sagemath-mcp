name: Release

on:
  push:
    tags:
      - "v*"
  # The registry and release jobs otherwise run for the first time during a real
  # release, which is a poor place to discover a typo. This exercises both
  # without publishing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate the publish paths without publishing"
        type: boolean
        default: true

# Read-only by default. Every job that publishes something declares exactly the
# write scopes it needs (packages, id-token, attestations, contents for the
# release object) at job level, so `test` and `helm` never hold a write token.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install project
        run: uv pip install -e .[dev]
      - name: Lint
        run: make lint
      - name: Tests
        run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # Sigstore signing of the provenance, via OIDC
      attestations: write   # store it under the repository's attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Create virtual environment
        run: uv venv
      - name: Install build tool
        run: uv pip install build
      - name: Build artifacts
        run: uv run python -m build --sdist --wheel --outdir dist
      - name: Build the MCPB desktop bundle
        # `mcpb pack` validates the manifest against the published schema as it
        # packs, so a bad manifest fails here -- in the job every publish
        # depends on -- rather than inside someone's desktop app after a
        # one-click install.
        #
        # The packer is pinned to an exact version, not `@latest`. It runs
        # inside the release, and what it produces is signed and attested a few
        # steps later -- so an unpinned tool means our signature vouches for
        # whatever npm served that minute. npm versions are immutable, so a
        # version pin is a real pin even though it is not a hash. Moving it is a
        # deliberate review step: `make mcpb` carries the same version and a test
        # fails if the two drift apart.
        #
        # It is packed into bundle/, NOT dist/, and that is not cosmetic: the
        # publish job uploads `packages-dir: dist` to PyPI, and twine refuses a
        # directory holding anything it does not recognise as a distribution
        # ("InvalidDistribution: Unknown distribution format"). A .mcpb in dist/
        # would therefore fail the release at the PyPI step, after the images
        # were already pushed and signed. dist/ is wheel and sdist only.
        #
        # The version has to come from the ref TYPE, not from stripping a `v`
        # off the ref name: on a `workflow_dispatch` the ref name is the branch,
        # and a branch name with a slash in it turned the output into
        # `bundle/sagemath-mcp-fix/some-branch.mcpb` -- a nested directory, and a
        # dry run that failed on the `ls` right after. Found by running the dry
        # run, which is what it is for.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dryrun"
          fi
          mkdir -p bundle
          npx --yes @anthropic-ai/mcpb@2.1.2 pack packaging/mcpb \
            "bundle/sagemath-mcp-${VERSION}.mcpb"
          ls -l bundle/*.mcpb
      - name: Keep dist/ to what PyPI accepts
        # The publish job uploads this directory, and twine reads all of it. A
        # stray file here fails the release at the PyPI step -- after the images
        # are pushed and signed -- so it is caught in the job that creates the
        # directory, on dry runs too.
        run: |
          for file in dist/*; do
            case "$file" in
              *.whl|*.tar.gz) ;;
              *) echo "::error::$file is in dist/, which the publish job uploads"\
                      "to PyPI; twine accepts only wheels and sdists there."\
                      "Release-only assets belong in bundle/ or provenance/."
                 exit 1 ;;
            esac
          done
          ls -l dist
      - name: Source SBOM (SPDX)
        # The dependency inventory of what the wheel pulls in, read from
        # uv.lock and pyproject (.syft.yaml keeps the build venv and dist out of
        # it). The runtime inventory -- Sage and everything the image carries --
        # is the image SBOM in the docker job. Both are attached to the GitHub
        # release; this one is generated on dry runs too, so the path is tested.
        # The action opens output-file without creating its directory, hence
        # the mkdir; the SYFT_SOURCE_* variables name the SBOM's root package
        # (syft otherwise derives one from the scan path, which it warns about).
        run: mkdir -p sbom
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_SOURCE_NAME: sagemath-mcp
          SYFT_SOURCE_VERSION: ${{ github.ref_name }}
        with:
          path: .
          format: spdx-json
          output-file: sbom/sagemath-mcp-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Keep the SBOM under the attestation limit
        # GitHub refuses an attestation predicate over 16 MiB. v0.8.0's first
        # attempt discovered that the hard way, at the last step of the job,
        # after the image was already pushed and signed. Checking here fails
        # early and names the fix.
        run: |
          limit=16777216
          for file in sbom/*.json; do
            size=$(stat -c%s "$file")
            printf '%s: %s bytes\n' "$file" "$size"
            if [ "$size" -ge "$limit" ]; then
              echo "::error::$file is $size bytes, at or over GitHub's ${limit}-byte"\
                   "attestation limit. The usual cause is syft file-ownership"\
                   "relationships; see .syft.yaml."
              exit 1
            fi
          done
      - name: Attest build provenance for the release artifacts
        # SLSA provenance for the wheel, the sdist and the desktop bundle,
        # signed through Sigstore and stored with the repository (`gh
        # attestation verify <file> --owner XBP-Europe`). PyPI gets its own PEP
        # 740 attestation for the wheel and sdist in the publish job; this one
        # covers the copies attached to the GitHub release, and is the only
        # provenance the .mcpb has. Tag push only: a dry run must not attest
        # artifacts that are never published.
        id: attest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            bundle/*.mcpb
      - name: Keep the provenance as a release asset
        # The attestation above lives in GitHub's attestation store, which is
        # the right place to verify against but not somewhere a consumer -- or a
        # scanner -- finds by looking at the release. The action writes the
        # Sigstore bundle it just created to `bundle-path`: one bundle whose
        # in-toto statement names every subject it attested (wheel, sdist,
        # .mcpb), written as a single JSON line. Copying it out under the
        # conventional `.intoto.jsonl` name puts the same provenance on the
        # release itself, where `gh attestation verify <artifact> --owner
        # XBP-Europe --bundle <this file>` checks an artifact offline, with no
        # call to GitHub. The script then reads the bundle back and fails if any
        # of the three artefacts is missing from it, because provenance that
        # silently covers less than the release ships is worse than none.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p provenance
          cp "${BUNDLE_PATH}" "provenance/sagemath-mcp-${VERSION}.intoto.jsonl"
          python3 scripts/check_provenance_bundle.py \
            "provenance/sagemath-mcp-${VERSION}.intoto.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb
          path: bundle/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: provenance
          path: provenance/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-source
          path: sbom/*

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write   # provenance and SBOM attestations for the image
    env:
      # One publish policy, shared by every destination below: publish ONLY on a
      # tag push. A workflow_dispatch can target a tag ref, so gating on the ref
      # alone let a "validate without publishing" dispatch push and sign a GHCR
      # image; requiring the push event closes that. Dispatch is always a dry
      # run, which is the whole reason it exists (exercise the paths safely).
      DO_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
      - name: Build candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: sagemath-mcp-candidate:smoke
          labels: ${{ steps.meta.outputs.labels }}
      - name: Stateful smoke test of the built image
        # The exact artifact and dependency set being published, not the source
        # tree: `pip install .` in the Dockerfile resolves dependencies at build
        # time, so this is where a moved dependency surfaces. fastmcp 4.0.3
        # broke exactly this workflow (assign, then read back in the same
        # session) while every per-file signature stayed valid.
        run: |
          docker run --rm -i --entrypoint sage sagemath-mcp-candidate:smoke -python - <<'PY'
          import asyncio
          from fastmcp import Client
          from sagemath_mcp import server

          async def main() -> None:
              async with Client(server.mcp) as client:
                  first = await client.call_tool("evaluate_sage", {"code": "smoke = 41"})
                  assert not first.is_error, first
                  second = await client.call_tool("evaluate_sage", {"code": "smoke + 1"})
                  assert not second.is_error, second
                  text = "".join(
                      block.text for block in second.content if getattr(block, "text", None)
                  )
                  assert "42" in text, f"stateful read returned {text!r}"
                  print("stateful smoke: OK ->", text)

          asyncio.run(main())
          PY
      - name: Log in to GHCR
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        # Push the exact image the smoke test ran against -- retag and push it,
        # rather than a second build-push-action that rebuilds and could produce
        # a different artifact than the one just verified. All tags point at one
        # image, so they share one registry digest, which is what gets signed.
        if: env.DO_PUSH == 'true'
        id: push
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag sagemath-mcp-candidate:smoke "$tag"
            docker push "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"
          FIRST_TAG=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$FIRST_TAG" | cut -d@ -f2)
          test -n "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          # OCI names are lowercase; github.repository is not.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        if: env.DO_PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign container image
        if: env.DO_PUSH == 'true'
        env:
          COSIGN_YES: "true"
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          DIGEST="${{ steps.push.outputs.digest }}"
          cosign sign "${IMAGE}@${DIGEST}"
      - name: Image SBOM (SPDX)
        # Inventory of the exact image the smoke test ran against -- the Sage
        # runtime, its Python packages and the OS layer. Read from the local
        # daemon, so it runs on dry runs too and the path is exercised on every
        # dispatch; only the attestation below is gated on a real push.
        run: mkdir -p sbom
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: sagemath-mcp-candidate:smoke
          format: spdx-json
          output-file: sbom/sagemath-mcp-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Keep the SBOM under the attestation limit
        # GitHub refuses an attestation predicate over 16 MiB. v0.8.0's first
        # attempt discovered that the hard way, at the last step of the job,
        # after the image was already pushed and signed. Checking here fails
        # early and names the fix.
        run: |
          limit=16777216
          for file in sbom/*.json; do
            size=$(stat -c%s "$file")
            printf '%s: %s bytes\n' "$file" "$size"
            if [ "$size" -ge "$limit" ]; then
              echo "::error::$file is $size bytes, at or over GitHub's ${limit}-byte"\
                   "attestation limit. The usual cause is syft file-ownership"\
                   "relationships; see .syft.yaml."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-image
          path: sbom/*
      - name: Attest image build provenance (SLSA)
        # SLSA provenance for the pushed digest, signed through Sigstore, stored
        # with the repository and pushed to GHCR next to the Cosign signature.
        # Verify with `gh attestation verify oci://<image>:<tag> --owner XBP-Europe`.
        if: env.DO_PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        # The SBOM above, bound to the same digest as an SPDX attestation, so a
        # consumer can fetch the inventory of a running image from the registry
        # rather than trusting a file attached to a release page.
        if: env.DO_PUSH == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom/sagemath-mcp-image.spdx.json
          push-to-registry: true

  # The optional passagemath image (Dockerfile.passagemath): the same server on
  # the pip-installable SageMath fork, built NATIVELY per architecture -- the
  # monolithic sagemath/sagemath base is linux/amd64 only, and this image exists
  # so arm64 hosts (Apple silicon, Graviton) get a native container. Each
  # architecture is smoke-tested on its own runner before anything is pushed;
  # the manifest job below then assembles the multi-arch index from the two
  # tested images and signs it. Same push-only policy as the primary image.
  docker-passagemath:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DO_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build candidate image (native ${{ matrix.arch }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.passagemath
          load: true
          tags: sagemath-mcp-passagemath-candidate:smoke
      - name: Stateful smoke test of the built image
        # Same assign-then-read as the primary image, plus the two things that
        # are specific to this runtime: the passagemath artifact set must be the
        # one selected, and the Maxima (solve) and GAP (group order) backends
        # must answer -- the two that passagemath releases have broken before.
        run: |
          docker run --rm -i --entrypoint sage sagemath-mcp-passagemath-candidate:smoke -python - <<'PY'
          import asyncio
          from fastmcp import Client
          from sagemath_mcp import _artifacts, server

          assert _artifacts.IS_PASSAGEMATH, "the passagemath artifact set was not selected"

          def text_of(result):
              return "".join(b.text for b in result.content if getattr(b, "text", None))

          async def main() -> None:
              async with Client(server.mcp) as client:
                  first = await client.call_tool("evaluate_sage", {"code": "smoke = 41"})
                  assert not first.is_error, first
                  second = await client.call_tool("evaluate_sage", {"code": "smoke + 1"})
                  assert not second.is_error, second
                  assert "42" in text_of(second), f"stateful read returned {text_of(second)!r}"
                  maxima = await client.call_tool("evaluate_sage", {"code": "solve(x^2 - 4, x)"})
                  assert not maxima.is_error and "2" in text_of(maxima), maxima
                  gap = await client.call_tool("evaluate_sage", {"code": "SymmetricGroup(4).order()"})
                  assert not gap.is_error and "24" in text_of(gap), gap
                  print("passagemath stateful smoke: OK ->", text_of(second), text_of(maxima), text_of(gap))

          asyncio.run(main())
          PY
      - name: Log in to GHCR
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image under its architecture tag
        # The exact image the smoke test ran against, pushed as
        # <tag>-passagemath-<arch>; the manifest job joins the two into the
        # multi-arch <tag>-passagemath index. The arch tags stay visible, which
        # is how a consumer pins one architecture deliberately.
        if: env.DO_PUSH == 'true'
        id: push
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          ARCH_TAG="${IMAGE}:${GITHUB_REF_NAME}-passagemath-${{ matrix.arch }}"
          docker tag sagemath-mcp-passagemath-candidate:smoke "$ARCH_TAG"
          docker push "$ARCH_TAG"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$ARCH_TAG" | cut -d@ -f2)
          test -n "$DIGEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Image SBOM (SPDX)
        run: mkdir -p sbom
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: sagemath-mcp-passagemath-candidate:smoke
          format: spdx-json
          output-file: sbom/sagemath-mcp-image-passagemath-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Keep the SBOM under the attestation limit
        # GitHub refuses an attestation predicate over 16 MiB. v0.8.0's first
        # attempt discovered that the hard way, at the last step of the job,
        # after the image was already pushed and signed. Checking here fails
        # early and names the fix.
        run: |
          limit=16777216
          for file in sbom/*.json; do
            size=$(stat -c%s "$file")
            printf '%s: %s bytes\n' "$file" "$size"
            if [ "$size" -ge "$limit" ]; then
              echo "::error::$file is $size bytes, at or over GitHub's ${limit}-byte"\
                   "attestation limit. The usual cause is syft file-ownership"\
                   "relationships; see .syft.yaml."
              exit 1
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-image-passagemath-${{ matrix.arch }}
          path: sbom/*
      - name: Attest image build provenance (SLSA)
        if: env.DO_PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        if: env.DO_PUSH == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom/sagemath-mcp-image-passagemath-${{ matrix.arch }}.spdx.json
          push-to-registry: true

  docker-passagemath-manifest:
    needs: docker-passagemath
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      DO_PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Extract metadata (tags with the -passagemath suffix)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-passagemath,onlatest=true
      - name: Log in to GHCR
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble the multi-arch index from the two tested images
        # No rebuild: the index references the per-arch manifests the smoke
        # tests ran against, so what a consumer pulls is what was tested.
        if: env.DO_PUSH == 'true'
        id: index
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SOURCES=("${IMAGE}:${GITHUB_REF_NAME}-passagemath-amd64" "${IMAGE}:${GITHUB_REF_NAME}-passagemath-arm64")
          TAG_ARGS=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAG_ARGS+=(-t "$tag")
          done <<< "${{ steps.meta.outputs.tags }}"
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"
          FIRST_TAG=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -n1)
          DIGEST=$(docker buildx imagetools inspect "$FIRST_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          test -n "$DIGEST"
          docker buildx imagetools inspect "$FIRST_TAG"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Dry run - show the index that would be assembled
        if: env.DO_PUSH != 'true'
        run: |
          echo "Would assemble a linux/amd64 + linux/arm64 index tagged:"
          printf '  %s\n' ${{ steps.meta.outputs.tags }}
      - name: Install Cosign
        if: env.DO_PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the index
        if: env.DO_PUSH == 'true'
        env:
          COSIGN_YES: "true"
        run: cosign sign "${{ steps.index.outputs.image }}@${{ steps.index.outputs.digest }}"
      - name: Attest index build provenance (SLSA)
        if: env.DO_PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  helm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint Helm chart
        run: helm lint charts/sagemath-mcp
      - name: Template Helm chart
        run: helm template sagemath charts/sagemath-mcp --debug

  publish:
    # Every image is a release artefact: PyPI does not publish if the optional
    # passagemath image failed to build, test or assemble, so a release is
    # always all of its artefacts or none.
    needs: [build, docker, docker-passagemath-manifest, helm]
    # PyPI is irreversible; publish only on a tag PUSH. A workflow_dispatch can
    # target a tag ref, so `startsWith(github.ref, ...)` alone was reachable from
    # a dispatch (even a dry-run one) -- the push-event gate is what actually
    # keeps a manual run from publishing. Same policy as DO_PUSH above.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/sagemath-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          # PEP 740: a Sigstore attestation per file, tying the wheel and sdist
          # to this workflow run through Trusted Publishing. The action's
          # default, made explicit because the README advertises it; verified
          # present on the 0.7.0 files at pypi.org/integrity/.
          attestations: true

  # The registry verifies ownership by looking for an "mcp-name:" marker in the
  # published PyPI description, so this can only run once the package is live.
  mcp-registry:
    needs: [publish]
    # On a tag push, gated on a successful PyPI publish so the registry can never
    # announce a version that was not shipped. On a manual dispatch, publish is
    # skipped and this runs in dry-run mode. Same push-only publish policy as the
    # steps below.
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        && needs.publish.result == 'success')
       || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC, so no long-lived registry token is stored
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Align server.json with the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION:-0.0.0-dryrun}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher
      - name: Publish to the MCP registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - name: Dry run - validate the manifest and login only
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          python3 -c "import json,sys; d=json.load(open('server.json')); \
            assert d['name'] and d['version'] and d['packages'], 'server.json incomplete'; \
            print('server.json parses:', d['name'], d['version'])"
          ./mcp-publisher login github-oidc
          echo "Dry run: authenticated successfully, not publishing."

  # Runs last so a failed publish cannot leave a release announcing a version
  # that was never shipped. Until this existed, every release object was created
  # by hand, and v0.4.0 shipped to PyPI while the releases page still advertised
  # v0.3.1 as Latest -- which is also where pyproject points its Changelog URL.
  github-release:
    needs: [publish]
    # On a tag push, gated on a successful PyPI publish so a release object can
    # never announce a version that was not shipped. On a manual dispatch,
    # publish is skipped and this runs in dry-run mode. Same push-only policy.
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        && needs.publish.result == 'success')
       || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Collect the desktop bundle
        # Packed in the build job, kept out of dist/ so twine never sees it.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mcpb
          path: bundle
      - name: Collect the provenance
        # Only exists on a tag push -- the attestation step that produces it is
        # gated the same way -- so a dry run skips this and attaches no
        # provenance, which is correct: it has nothing signed to attach.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: provenance
      - name: Collect the SBOMs
        # Both SBOMs ride along as release assets, next to the wheel and sdist,
        # for consumers who want a file rather than a registry attestation.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sbom-*
          path: sbom
          merge-multiple: true
      - name: Extract release notes from the changelog
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Print the body of the "## [VERSION]" section, stopping at the next one.
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag && index($0, "## [") == 1 { exit }
            # Link-reference definitions live at the foot of the file; for the
            # newest entry there is no following section to stop at.
            flag && /^\[[0-9]+\.[0-9]+\.[0-9]+\]:/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            # Missing entry is worth surfacing, but not worth failing a release
            # that has already been published to PyPI.
            echo "::warning::No CHANGELOG.md entry for ${VERSION}; using generated notes."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dry run - render the notes without creating a release
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          echo "Would create a release with these notes:"
          head -40 release-notes.md || echo "(no changelog entry; generated notes would be used)"
          echo "Would attach these assets:"
          ls -l dist bundle sbom
          # Both SBOMs must exist and parse, or the release would ship without
          # the inventory the README advertises.
          for f in sbom/sagemath-mcp-source.spdx.json sbom/sagemath-mcp-image.spdx.json \
                   sbom/sagemath-mcp-image-passagemath-amd64.spdx.json \
                   sbom/sagemath-mcp-image-passagemath-arm64.spdx.json; do
            python3 -c "import json,sys; d=json.load(open('$f')); \
              print('$f:', d['spdxVersion'], len(d.get('packages', [])), 'packages')"
          done
      - name: Create the GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; nothing to do."
            exit 0
          fi
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --verify-tag \
              --notes-file release-notes.md \
              dist/* bundle/* sbom/* provenance/*
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              dist/* bundle/* sbom/* provenance/*
          fi
