name: Bump Version

on:
  workflow_dispatch:
    inputs:
      segment:
        description: "Version segment to bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# Read-only by default; the bump job declares its own write scopes below.
permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      # Pushes the release/vX.Y.Z branch. It opens no pull request (see the
      # last step), so it needs no pull-requests scope.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ensure clean working tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree has uncommitted changes. Please commit or stash before running the bump."
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The script re-locks with `uv lock --offline`. Without this step it used
      # whatever uv the runner image carried, or none (and then left uv.lock at
      # the old version, which `uv lock --check` refuses); the lock is written
      # by the uv every other workflow pins.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: .tool-versions
      - name: Bump version
        id: bump
        run: |
          NEW_VERSION=$(python scripts/bump_version.py --segment "${{ inputs.segment }}")
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
      # The script re-locks with `uv lock --offline`, which needs every
      # package's metadata already in uv's cache. A runner's cache starts
      # empty, so on the 0.10.1 run it failed, the script only warned, and the
      # bump commit left uv.lock at 0.10.0, which `uv lock --check` refuses.
      # Here the lock is resolved online, without --upgrade, so only the
      # project's own version line moves; --check then proves it is current.
      - name: Re-lock
        run: |
          uv lock
          uv lock --check
      # main is a protected branch with required status checks, so a direct
      # push is rejected. The bump goes through a pull request like any other
      # change, and the release tag is pushed once that merges. The workflow
      # pushes the branch but does not open that pull request: this repository
      # does not let GitHub Actions create pull requests (the 0.10.1 run failed
      # on it), and one opened with this job's token would start no CI, so the
      # required checks would never run on it. The summary links the PR to open.
      - name: Push the release branch
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          if git rev-parse "v${NEW_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${NEW_VERSION} already exists; aborting."
            exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="release/v${NEW_VERSION}"
          git checkout -b "${BRANCH}"
          # Stage every file the bump script touches. Listing files by hand is
          # what let the Helm chart drift out of sync in earlier releases.
          git add -A
          if git diff --cached --quiet; then
            echo "No version changes detected; aborting."
            exit 1
          fi
          git commit -m "Bump version to ${NEW_VERSION}"
          git push origin "${BRANCH}"
          COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...${BRANCH}?expand=1"
          {
            echo "## Bumped to ${NEW_VERSION}"
            echo ""
            echo "Pushed \`${BRANCH}\`. Add the hand-written release changes there"
            echo "(CHANGELOG section, SECURITY.md recipe, ROADMAP), then open the"
            echo "pull request: [compare and open](${COMPARE}), or"
            echo ""
            echo '```bash'
            echo "gh pr create --base ${GITHUB_REF_NAME} --head ${BRANCH} --title \"Release ${NEW_VERSION}\""
            echo '```'
            echo ""
            echo "Once it merges, push the tag to publish:"
            echo ""
            echo '```bash'
            echo "git tag v${NEW_VERSION} && git push origin v${NEW_VERSION}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
