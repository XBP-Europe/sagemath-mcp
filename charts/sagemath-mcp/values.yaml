replicaCount: 1

image:
  repository: ghcr.io/xbp-europe/sagemath-mcp
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

# UID/GID must match the `sage` account in the base image (SageMath 10.9 uses
# 1001; 10.5 and earlier used 1000). /home/sage is mode 0750, so a mismatched
# UID cannot traverse it and the container fails to start. Update these
# together with the base image in the Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  # Sage needs a writable temp dir and its own dot-directory, and nothing else.
  # The emptyDir mounts below supply both; without them the container fails with
  # "No usable temporary directory found". Verified against the real image.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Writable scratch for a read-only root filesystem. Sized to match the tmpfs
# mounts in docker-compose.yml so the two deployments behave the same.
scratchVolumes:
  enabled: true
  tmpSizeLimit: 512Mi
  sageHomeSizeLimit: 256Mi
  sageHomePath: /home/sage/.sage

service:
  type: ClusterIP
  port: 8314
  targetPort: 8314

env: {}
extraEnvFrom: []

args: []

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 12

# Defaults, not an empty map: an unbounded pod is one runaway computation away
# from evicting its neighbours, and mem_limit/pids_limit are already set on the
# compose side. Raise for heavy workloads; Sage itself wants ~1Gi at rest.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

nodeSelector: {}
tolerations: []
affinity: {}

extraVolumes: []
extraVolumeMounts: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
