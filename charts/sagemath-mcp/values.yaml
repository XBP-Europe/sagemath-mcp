replicaCount: 1

image:
  repository: ghcr.io/xbp-europe/sagemath-mcp
  # Prefer a release tag over `latest` in anything you deploy. For arm64 nodes
  # use the `-passagemath` twin of the tag (e.g. `v0.8.0-passagemath`): the
  # primary image is linux/amd64 only, the passagemath image is amd64 + arm64,
  # and both run as UID/GID 1001 with the same writable paths, so nothing else
  # in this chart changes.
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: ""

# Nothing in this server talks to the Kubernetes API, and SECURITY.md tells
# operators not to mount sensitive paths into the worker. Without this the pod
# gets the namespace's default ServiceAccount token projected into it, and a
# read-only root filesystem does not stop anything *reading* it.
automountServiceAccountToken: false

# The bearer token, for anyone putting this on a network. Point it at a Secret
# you created; the chart never renders the value itself, so it stays out of the
# Deployment spec, `kubectl describe` and the Helm release Secret. Leave empty
# for no authentication, which is the supported posture for a local run.
#
#   kubectl create secret generic sagemath-mcp-token --from-literal=token=...
#   helm install ... --set auth.existingSecret=sagemath-mcp-token
auth:
  existingSecret: ""
  secretKey: token

podAnnotations: {}
podLabels: {}

# UID/GID must match the `sage` account in the base image (SageMath 10.9 uses
# 1001; 10.5 and earlier used 1000). /home/sage is mode 0750, so a mismatched
# UID cannot traverse it and the container fails to start. Update these
# together with the base image in the Dockerfile.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  # Docker applies its default seccomp profile without being asked; Kubernetes
  # does not. Without this the pod runs Unconfined, with the whole syscall
  # table exposed to a process whose job is executing model-written code --
  # which made the chart materially weaker than the Compose deployment that
  # SECURITY.md describes it alongside.
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  # Sage needs a writable temp dir and its own dot-directory, and nothing else.
  # The emptyDir mounts below supply both; without them the container fails with
  # "No usable temporary directory found". Verified against the real image.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Writable scratch for a read-only root filesystem. Sized to match the tmpfs
# mounts in docker-compose.yml so the two deployments behave the same.
scratchVolumes:
  enabled: true
  tmpSizeLimit: 512Mi
  sageHomeSizeLimit: 256Mi
  sageHomePath: /home/sage/.sage

service:
  type: ClusterIP
  port: 8314
  targetPort: 8314

env: {}
extraEnvFrom: []

args: []

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  # Readiness runs the real Sage path (/ready evaluates 1+1), so a pod whose
  # backend cannot compute stops receiving traffic even while its process is
  # up. Liveness stays a TCP connect on purpose: a wedged computation should
  # not restart the whole pod. timeoutSeconds covers a cold first worker spawn.
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 12
  failureThreshold: 3

startupProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 12

# Defaults, not an empty map: an unbounded pod is one runaway computation away
# from evicting its neighbours, and mem_limit/pids_limit are already set on the
# compose side. Raise for heavy workloads; Sage itself wants ~1Gi at rest.
resources:
  requests:
    cpu: 250m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 4Gi

nodeSelector: {}
tolerations: []
affinity: {}

extraVolumes: []
extraVolumeMounts: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
