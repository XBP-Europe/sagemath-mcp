services:
  sage-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: sagemath-mcp:local
    container_name: sage-mcp
    # No hardcoded user: the image already runs as the base image's `sage`
    # account. Pinning a numeric UID here breaks whenever upstream renumbers it
    # (sage moved from uid 1000 to 1001 between SageMath 10.5 and 10.9, and
    # /home/sage is mode 0750, so a wrong UID cannot even reach /usr/bin/sage).
    restart: unless-stopped
    # The AST validator is defence in depth, not a boundary: this container is
    # the boundary. A sandbox escape was demonstrated reading every environment
    # variable, reading the mounted checkout and opening outbound sockets, so
    # the blast radius is bounded here rather than in the validator alone.
    # Verified working: Sage needs a writable temp dir and its own dot-directory
    # and nothing else. Without the two tmpfs mounts below it fails outright
    # ("No usable temporary directory found"), which is how they were sized.
    read_only: true
    tmpfs:
      - /tmp:rw,size=512m
      - /home/sage/.sage:rw,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256           # a fork bomb cannot exhaust the host
    mem_limit: 4g             # a runaway computation cannot either
    ports:
      - "8314:8314"
    environment:
      # Override runtime behavior by setting SageSettings env vars here.
      # Example: SAGEMATH_MCP_EVAL_TIMEOUT: "45"
      # These defaults mirror the packaged configuration; override as needed.
      SAGEMATH_MCP_EVAL_TIMEOUT: "30"
      SAGEMATH_MCP_IDLE_TTL: "900"
      SAGEMATH_MCP_SHUTDOWN_GRACE: "2"
      SAGEMATH_MCP_MAX_STDOUT: "100000"
    volumes:
      # Read-only. The server runs from the package installed into the image,
      # not from this mount, so nothing here needs to be writable -- and an
      # escaped process should not be able to edit the checkout it is reading.
      # Drop the :ro only if you are deliberately developing against the mount.
      - ./:/workspace:ro
