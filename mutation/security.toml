# Mutation testing of the AST security policy. Line coverage proves almost
# nothing for a policy; a mutation score proves the bypass suite actually
# catches a weakening of a rule. Scoped to the logic -- the validator
# (security.py) and the policy, refusal and import modules split out of it in
# the 2026-09 refactor -- while allowlist.py is generated data whose
# correctness the Sage-agreement integration test guards.
[cosmic-ray]
module-path = [
    "src/sagemath_mcp/security.py",
    "src/sagemath_mcp/policy.py",
    "src/sagemath_mcp/refusals.py",
    "src/sagemath_mcp/imports.py",
]
timeout = 60.0
excluded-modules = []
test-command = "env PYTHONPATH=src python -m pytest -x -q tests/test_security.py tests/test_security_bypass.py tests/test_generated_code_lint.py tests/test_math_coverage.py tests/test_security_property.py"

[cosmic-ray.distributor]
name = "local"
