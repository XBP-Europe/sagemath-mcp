{% set name = "sagemath-mcp" %}
{% set version = "0.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sagemath_mcp-{{ version }}.tar.gz
  sha256: 0faeccb990b2e2a3a1c4bca826ca77184cd1ebe21a445abbb68c31ee71a207e3

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0
  entry_points:
    - sagemath-mcp = sagemath_mcp.server:main

requirements:
  host:
    - python {{ python_min }}
    - hatchling >=1.32.0
    - pip
  run:
    - python >={{ python_min }}
    # Capped below 4 upstream: under fastmcp 4.0.3 a second client's identical
    # tool call is served from cache instead of running in its own session.
    # conda-forge carries 3.4.7, which is the floor this package needs.
    - fastmcp >=3.4.7,<4
    - pydantic >=2.13.4
    - anyio >=4.14.2

test:
  imports:
    - sagemath_mcp
  commands:
    # `--help` is the only command that works without a SageMath runtime; every
    # evaluation needs one, and this package deliberately does not depend on
    # Sage (see about/description).
    - pip check
    - sagemath-mcp --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/XBP-Europe/sagemath-mcp
  summary: Model Context Protocol server that provides stateful SageMath computations.
  description: |
    A Model Context Protocol (MCP) server that gives a language model a
    sandboxed mathematical subset of SageMath: 40 stateful tools for symbolic
    calculus, algebra, number theory, graphs, groups, elliptic curves, plotting
    and claim verification. Each MCP session gets a dedicated Sage worker
    process, so variables, functions and assumptions persist across tool calls.
    Caller code is deny-by-default: a name is refused unless the generated
    allowlist offers it or the caller's own code bound it.

    A SageMath runtime is REQUIRED at run time and is deliberately not a
    dependency of this package: `sage` must be on PATH (conda-forge ships
    `sage`, which is the usual way to get it), or the pip extra
    `sagemath-mcp[passagemath]` can supply one. Making Sage a hard dependency
    would force a multi-gigabyte install on users who run the project's
    hardened container instead.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://github.com/XBP-Europe/sagemath-mcp/blob/main/USAGE.md
  dev_url: https://github.com/XBP-Europe/sagemath-mcp

extra:
  recipe-maintainers:
    - csteinlxbp
