# Dependencies for the MCPB bundle. The host application installs these with uv
# on first launch, which is what lets the bundle stay about 27 KB (most of it the icon) while still
# shipping a working Sage.
#
# The Sage runtime is the [passagemath] extra -- a pip-installable SageMath, the
# same one this project's own CI lane tests against a pinned version. That is
# roughly 1 GB of wheels on first launch. The alternative would be requiring a
# local `sage` on PATH, which no one-click install can promise.
#
# Capped at 3.12, the Python that extra is tested on: the host runs `uv run`,
# and with only a floor uv picks its newest Python (3.15 at the time of
# writing), where passagemath's dependencies have no wheels and must be compiled. On a
# machine with no C compiler -- most of the ones a one-click install is for --
# the first launch then fails.
[project]
name = "sagemath-mcp-bundle"
version = "0.9.7"
description = "MCPB bundle for the SageMath MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sagemath-mcp[passagemath]==0.9.7",
]
