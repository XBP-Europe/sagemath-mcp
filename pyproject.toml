[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "sagemath-mcp"
version = "0.7.0"
description = "Model Context Protocol server that provides stateful SageMath computations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Capped below 4: under fastmcp 4.0.3 the cache-isolation suite fails --
    # a second client's identical tool call is not executed in its own session,
    # the cross-client leak tests/test_cache_isolation.py exists to catch.
    # Raise only after that suite passes on the new major (REVIEW_ACTIONS 68).
    "fastmcp>=3.4.7,<4",
    "pydantic>=2.13.4",
    "anyio>=4.14.2",
]
authors = [
    { name = "XBP Europe" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/XBP-Europe/sagemath-mcp"
Repository = "https://github.com/XBP-Europe/sagemath-mcp"
Issues = "https://github.com/XBP-Europe/sagemath-mcp/issues"
Changelog = "https://github.com/XBP-Europe/sagemath-mcp/releases"

[project.optional-dependencies]
cli = [
    # Capped below 2.0 by fastmcp-slim (mcp<2.0,>=1.24.0); do not raise past 1.x.
    "mcp[cli]>=1.29.0",
]
passagemath = [
    # A pip-installed alternative runtime to the monolithic SageMath Docker image
    # (~1 GB download vs a 3 GB image pull; `sage.all` and the worker run
    # unmodified). Pinned EXACTLY, never a range: passagemath's own release QA
    # shipped a broken Maxima backend in 10.8.10/10.8.11 (docs/
    # passagemath_evaluation.md §4), so a bump goes through the cold-install smoke
    # gate, not automatically. The security artifacts dispatch to the passagemath
    # set at import (src/sagemath_mcp/_artifacts.py) when this is installed.
    "passagemath-standard==10.8.9",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "coverage>=7.15.4",
    "ruff>=0.16.2",
    "build>=1.5.0",
    "pip-audit>=2.10.1",
    # Property-based tests over the security policy (tests/test_security_property.py)
    # and mutation testing of it (make mutation, scripts/run_mutation_tests.py).
    "hypothesis>=6.167.1",
    "cosmic-ray>=8.7.0",
]

[project.scripts]
sagemath-mcp = "sagemath_mcp.server:main"

[tool.hatch.build]
packages = ["src/sagemath_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/sagemath_mcp/py.typed" = "sagemath_mcp/py.typed"

[tool.hatch.build.targets.sdist]
# The build backend is hatchling, which does not read MANIFEST.in -- that is a
# setuptools file. One lived here for a long time listing these same documents,
# and shipped none of them: every sdist contained README.md alone while
# DISTRIBUTION.md and build_release.py both said "documentation included".
include = ["src/sagemath_mcp/py.typed"]

[tool.hatch.build.targets.sdist.force-include]
"USAGE.md" = "USAGE.md"
"TESTING.md" = "TESTING.md"
"AGENTS.md" = "AGENTS.md"
"INSTALLATION.md" = "INSTALLATION.md"
"SECURITY.md" = "SECURITY.md"
"CONTRIBUTING.md" = "CONTRIBUTING.md"
"CHANGELOG.md" = "CHANGELOG.md"
"docs" = "docs"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "ASYNC", "RUF", "I"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
# Generated from the installed SageMath, which exports Unicode mathematical
# names (Greek letters, look-alikes for Latin ones). Which of the ambiguous-
# character rules fire depends on which names that Sage version happens to
# export, so a file-level `noqa` in the generated output flips between
# "needed" and "unused" (RUF100) across regenerations. Ignoring here keeps
# `make allowlist` from producing a file that fails lint.
"src/sagemath_mcp/allowlist.py" = ["RUF001", "RUF002", "RUF003"]
# Same rationale for the passagemath allowlist -- generated from the installed
# passagemath, whose Unicode mathematical names decide which rules fire.
"src/sagemath_mcp/allowlist_passagemath.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
addopts = "-ra --ignore=tests/cli_integration"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
filterwarnings = ["ignore::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
branch = true
source = ["sagemath_mcp"]
# The passagemath artifact set is imported only on a passagemath runtime
# (_artifacts.py dispatches to it), so it is never loaded by the monolithic,
# coverage-gated unit suite. It is generated data checked by the passagemath CI
# lane's agreement tests, the same way allowlist.py is checked on monolithic.
omit = [
    "src/sagemath_mcp/allowlist_passagemath.py",
    "src/sagemath_mcp/star_exports_passagemath.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
